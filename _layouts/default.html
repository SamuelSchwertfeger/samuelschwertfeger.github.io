<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% seo %}
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="{{ '/' | relative_url }}">Samuel Schwertfeger</a>
      <nav>
        <a href="{{ '/#research' | relative_url }}">Research</a>
        <a href="{{ '/#projects' | relative_url }}">Projects</a>
        <a href="{{ '/cv/' | relative_url }}"{% if page.url == '/cv/' %} aria-current="page"{% endif %}>CV</a>
        <a href="{{ '/#contact' | relative_url }}">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <div class="wrap">
      <p>
        <a href="mailto:{{ site.email }}">{{ site.email }}</a> ·
        <a href="https://github.com/{{ site.github }}">GitHub</a>
      </p>
      <p class="muted small">Views expressed here are my own and do not represent the U.S. Army or the Department of Defense.</p>
    </div>
  </footer>
</body>
</html>
